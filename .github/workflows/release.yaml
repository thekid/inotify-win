name: Release inotifywait

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate C# compiler
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "csc.exe not found at $csc" }
          "CSC=$csc" >> $env:GITHUB_ENV

      - name: Replace version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', '' -replace '$', '.0'
          $content = Get-Content .\src\AssemblyInfo.cs -Raw
          $updated = $content -replace 'AssemblyVersion\("[^"]+"\)', "AssemblyVersion(`"$version`")"
          Set-Content .\src\AssemblyInfo.cs -Value $updated -NoNewline

      - name: Build inotifywait.exe
        shell: pwsh
        run: |
          & $env:CSC -nologo -target:exe -optimize+ -platform:anycpu `
            -out:inotifywait.exe `
            .\src\*.cs
          if ($LASTEXITCODE -ne 0) { throw "Build failed with exit code $LASTEXITCODE" }

      - name: Test --version
        shell: pwsh
        run: |
          .\inotifywait.exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed with exit code $LASTEXITCODE" }

      - name: Create release ${{ github.ref_name }}
        run: |
          gh release create ${{ github.ref_name }}
          gh release upload ${{ github.ref_name }} inotifywait.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
